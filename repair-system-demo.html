<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社區維修報修 管制系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #faf7f0;
  --text: #071e29;
  --muted: #5c6b75;
  --border: #e4dcc8;
  --accent: #c8921e;
  --radius: 14px;
  --shadow: 0 4px 24px rgba(7,30,41,0.08);

  --st-received: #4c6ef5;     --st-received-l: rgba(76,110,245,0.12);
  --st-quoting: #c8921e;      --st-quoting-l: rgba(200,146,30,0.12);
  --st-review: #ff6b4a;       --st-review-l: rgba(255,107,74,0.12);
  --st-inprogress: #7c5cff;   --st-inprogress-l: rgba(124,92,255,0.12);
  --st-done: #06d6a0;         --st-done-l: rgba(6,214,160,0.12);
  --st-cancelled: #94a3b8;    --st-cancelled-l: rgba(148,163,184,0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
button, input, select, textarea { font-family: inherit; }

/* ── NAV BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 58px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar-brand-row { display: flex; align-items: center; gap: 12px; }
.topbar-logo { height: 34px; width: auto; display: block; }
.topbar-brand { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
.topbar-tag { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
@media (max-width: 560px) { .topbar-tag { display: none; } }

/* ── HERO ── */
.hero { padding: 56px 24px 40px; text-align: center; position: relative; overflow: hidden; }
.hero::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 50% -20%, rgba(200,146,30,0.12) 0%, transparent 70%),
    radial-gradient(circle 300px at 90% 100%, rgba(124,92,255,0.07) 0%, transparent 60%);
  pointer-events: none;
}
.hero::after {
  content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 90%);
  pointer-events: none; opacity: 0.5;
}
.hero-inner { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }
.hero-badge {
  display: inline-block; background: rgba(200,146,30,0.1); border: 1px solid rgba(200,146,30,0.35);
  color: var(--accent); font-size: 15px; font-weight: 700; letter-spacing: 2px;
  padding: 7px 20px; border-radius: 99px; margin-bottom: 18px;
}
.hero h1 {
  font-family: 'Noto Serif TC', serif;
  color: var(--text); font-size: clamp(26px, 4.8vw, 40px);
  font-weight: 900; letter-spacing: 2px; line-height: 1.3; margin-bottom: 12px;
}
.hero p { color: var(--muted); font-size: clamp(17px, 2.6vw, 20px); line-height: 1.85; max-width: 520px; margin: 0 auto 28px; }
.hero-stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.stat-pill {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 15px; font-weight: 700;
  padding: 8px 18px; border-radius: 99px; display: flex; align-items: center; gap: 8px;
}
.stat-pill b { color: var(--accent); font-size: 17px; }

/* ── PAGE ── */
.page { max-width: 880px; margin: 0 auto; padding: 8px 24px 90px; }

/* ── MODE TABS ── */
.mode-tabs {
  display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 5px; max-width: 420px; margin: 0 auto 32px;
}
.mode-tab {
  flex: 1; text-align: center; padding: 10px 16px; border-radius: 99px;
  font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none;
  transition: all 0.18s;
}
.mode-tab.active { background: var(--text); color: #fff; }

/* ── ADMIN BAR ── */
.admin-bar {
  display: none; align-items: center; justify-content: space-between; gap: 12px;
  background: rgba(124,92,255,0.08); border: 1px solid rgba(124,92,255,0.3);
  border-radius: var(--radius); padding: 14px 20px; margin-bottom: 24px;
}
.admin-bar.show { display: flex; flex-wrap: wrap; }
.admin-bar-label { font-size: 15px; font-weight: 700; color: #6247d9; display: flex; align-items: center; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 10px; font-size: 15px; font-weight: 700;
  cursor: pointer; border: none; transition: all 0.16s;
}
.btn-primary { background: var(--text); color: #fff; }
.btn-primary:hover { opacity: 0.85; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ── FILTER CHIPS ── */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip {
  padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 700;
  border: 1.5px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip.active { border-color: var(--chip-c, var(--text)); color: var(--chip-c, var(--text)); background: var(--chip-l, var(--surface)); }

/* ── CASE LIST ── */
.case-list { display: flex; flex-direction: column; gap: 12px; }
.empty-state {
  text-align: center; padding: 70px 24px; color: var(--muted);
  border: 1.5px dashed var(--border); border-radius: var(--radius); font-size: 17px; line-height: 1.8;
}
.case-card {
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--st-c, var(--border));
  border-radius: var(--radius); padding: 18px 20px; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.case-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.case-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.case-title { font-size: 18px; font-weight: 700; line-height: 1.4; }
.status-badge {
  flex-shrink: 0; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 99px;
  color: var(--st-c); background: var(--st-l); white-space: nowrap;
}
.case-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.case-meta span { display: flex; align-items: center; gap: 5px; }
.case-latest {
  font-size: 14px; color: var(--muted); background: rgba(7,30,41,0.03);
  border-radius: 8px; padding: 8px 12px; line-height: 1.6;
}
.case-latest b { color: var(--text); font-weight: 700; }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(7,30,41,0.45);
  z-index: 200; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: 18px; max-width: 560px; width: 100%;
  box-shadow: 0 20px 60px rgba(7,30,41,0.25); animation: modalUp 0.22s cubic-bezier(.34,1.2,.64,1);
}
@keyframes modalUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.modal-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 22px 24px 16px; border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 21px; font-weight: 900; line-height: 1.4; }
.modal-close {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--border); }
.modal-body { padding: 20px 24px 26px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-bottom: 20px; font-size: 15px; }
.info-grid .full { grid-column: 1 / -1; }
.info-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
.info-value { color: var(--text); line-height: 1.6; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 15px; color: var(--text); background: #fff;
}
.field textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.section-divider { display: flex; align-items: center; gap: 10px; margin: 22px 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
.section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.timeline { display: flex; flex-direction: column; gap: 14px; }
.tl-item { display: flex; gap: 12px; }
.tl-dot-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 5px; }
.tl-line { flex: 1; width: 1.5px; background: var(--border); margin-top: 4px; }
.tl-content { flex: 1; padding-bottom: 4px; }
.tl-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.tl-author { font-weight: 700; color: var(--text); }
.tl-text { font-size: 15px; line-height: 1.7; }
.tl-photo { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--accent); text-decoration: none; }

.pin-box { max-width: 320px; margin: 0 auto 32px; text-align: center; }
.pin-box input {
  width: 160px; text-align: center; letter-spacing: 8px; font-size: 22px; font-weight: 700;
  padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 12px;
}
.pin-error { color: var(--st-review); font-size: 14px; margin-top: 8px; display: none; }
.pin-error.show { display: block; }

/* ── FOOTER ── */
.footer-bar { text-align: center; padding: 40px 24px; border-top: 1px solid var(--border); margin-top: 20px; }
.footer-logo { height: 72px; width: auto; display: block; margin: 0 auto 14px; }
.footer-bar p { font-size: 14px; color: rgba(92,107,117,0.55); letter-spacing: 0.5px; }
.footer-bar .account { color: var(--accent); opacity: 0.9; margin-top: 6px; display: block; font-size: 15px; font-weight: 700; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--text); color: #fff; padding: 13px 24px; border-radius: 10px; font-size: 15px; font-weight: 700;
  z-index: 300; transition: transform 0.25s cubic-bezier(.34,1.2,.64,1); box-shadow: 0 8px 24px rgba(7,30,41,0.3);
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 560px) {
  .info-grid, .field-row { grid-template-columns: 1fr; }
  .hero { padding: 44px 18px 32px; }
  .page { padding: 8px 16px 90px; }
}
</style>
</head>

<script>
/* ============ 設定區：部署 GAS 後把網址貼在這裡 ============ */
const GAS_URL = 'PASTE_YOUR_GAS_WEB_APP_URL_HERE';
/* 尚未貼上網址前，系統會自動使用瀏覽器本機儲存做示範資料，方便你先測試介面 */
const USING_DEMO = GAS_URL.indexOf('PASTE_YOUR') === 0;

const STATUS_DEF = {
  received:   { label: '已受理',   color: 'var(--st-received)',   light: 'var(--st-received-l)' },
  quoting:    { label: '報價中',   color: 'var(--st-quoting)',    light: 'var(--st-quoting-l)' },
  review:     { label: '待審核',   color: 'var(--st-review)',     light: 'var(--st-review-l)' },
  inprogress: { label: '施工中',   color: 'var(--st-inprogress)', light: 'var(--st-inprogress-l)' },
  done:       { label: '已完成',   color: 'var(--st-done)',       light: 'var(--st-done-l)' },
  cancelled:  { label: '已取消',   color: 'var(--st-cancelled)',  light: 'var(--st-cancelled-l)' },
};
const STATUS_ORDER = ['received','quoting','review','inprogress','done','cancelled'];

let cases = [];
let mode = 'view';
let activeFilter = 'all';
let pin = sessionStorage.getItem('repairPin') || '';

/* ============ API 層：自動切換 GAS / demo 本機模式 ============ */
const api = {
  async list() {
    if (USING_DEMO) return demoList();
    const res = await fetch(GAS_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    return data.cases;
  },
  async createCase(payload) {
    if (USING_DEMO) return demoCreate(payload);
    return gasPost(Object.assign({ action: 'create_case', pin }, payload));
  },
  async updateCase(payload) {
    if (USING_DEMO) return demoUpdate(payload);
    return gasPost(Object.assign({ action: 'update_case', pin }, payload));
  },
  async addUpdate(payload) {
    if (USING_DEMO) return demoAddUpdate(payload);
    return gasPost(Object.assign({ action: 'add_update', pin }, payload));
  }
};

async function gasPost(body) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '寫入失敗');
  return data;
}

/* ---- demo 本機模式（尚未接 GAS 時用 localStorage 模擬） ---- */
function demoStore() {
  return JSON.parse(localStorage.getItem('repairDemoCases') || '[]');
}
function demoSave(list) { localStorage.setItem('repairDemoCases', JSON.stringify(list)); }
function demoList() { return demoStore().sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)); }
function demoCreate(payload) {
  if (pin !== '1234') throw new Error('PIN 錯誤（demo 模式密碼固定為 1234）');
  const now = new Date().toISOString();
  const c = Object.assign({ caseId: 'C' + Date.now(), createdAt: now, updatedAt: now, status: 'received', updates: [] }, payload);
  delete c.action; delete c.pin;
  const list = demoStore(); list.push(c); demoSave(list);
  return { ok: true, caseId: c.caseId };
}
function demoUpdate(payload) {
  if (pin !== '1234') throw new Error('PIN 錯誤（demo 模式密碼固定為 1234）');
  const list = demoStore();
  const c = list.find(x => x.caseId === payload.caseId);
  if (c) { Object.assign(c, payload); c.updatedAt = new Date().toISOString(); demoSave(list); }
  return { ok: true };
}
function demoAddUpdate(payload) {
  if (pin !== '1234') throw new Error('PIN 錯誤（demo 模式密碼固定為 1234）');
  const list = demoStore();
  const c = list.find(x => x.caseId === payload.caseId);
  if (c) {
    c.updates = c.updates || [];
    c.updates.unshift({ timestamp: new Date().toISOString(), content: payload.content, author: payload.author });
    c.updatedAt = new Date().toISOString();
    if (payload.status) c.status = payload.status;
    demoSave(list);
  }
  return { ok: true };
}

/* ============ 模式切換 ============ */
function switchMode(m) {
  if (m === 'admin' && !pin) {
    document.getElementById('pinBox').style.display = 'block';
    document.getElementById('tabAdmin').classList.add('active');
    document.getElementById('tabView').classList.remove('active');
    return;
  }
  mode = m;
  document.getElementById('tabView').classList.toggle('active', m === 'view');
  document.getElementById('tabAdmin').classList.toggle('active', m === 'admin');
  document.getElementById('adminBar').classList.toggle('show', m === 'admin');
  document.getElementById('pinBox').style.display = 'none';
  render();
}
function checkPin() {
  const val = document.getElementById('pinInput').value.trim();
  pin = val;
  sessionStorage.setItem('repairPin', val);
  document.getElementById('pinError').classList.remove('show');
  switchMode('admin');
  // 若密碼錯誤，第一次寫入動作時才會被後端擋下並提示
}
function logoutAdmin() {
  pin = '';
  sessionStorage.removeItem('repairPin');
  switchMode('view');
}

/* ============ 渲染 ============ */
function renderFilters() {
  const counts = { all: cases.length };
  STATUS_ORDER.forEach(k => counts[k] = cases.filter(c => c.status === k).length);
  const chips = ['<div class="chip ' + (activeFilter==='all'?'active':'') + '" onclick="setFilter(\'all\')">全部 ' + counts.all + '</div>'];
  STATUS_ORDER.forEach(k => {
    if (k === 'cancelled' && counts[k] === 0) return;
    const s = STATUS_DEF[k];
    chips.push('<div class="chip ' + (activeFilter===k?'active':'') + '" style="--chip-c:' + s.color + ';--chip-l:' + s.light + '" onclick="setFilter(\'' + k + '\')"><span class="dot" style="background:' + s.color + '"></span>' + s.label + ' ' + counts[k] + '</div>');
  });
  document.getElementById('filters').innerHTML = chips.join('');
}
function setFilter(f) { activeFilter = f; render(); }

function renderStats() {
  const active = cases.filter(c => !['done','cancelled'].includes(c.status)).length;
  const review = cases.filter(c => c.status === 'review').length;
  const now = new Date();
  const doneThisMonth = cases.filter(c => c.status === 'done' && new Date(c.updatedAt).getMonth() === now.getMonth() && new Date(c.updatedAt).getFullYear() === now.getFullYear()).length;
  document.getElementById('heroStats').innerHTML =
    '<div class="stat-pill">🔧 進行中 <b>' + active + '</b> 件</div>' +
    '<div class="stat-pill">📋 待審核 <b>' + review + '</b> 件</div>' +
    '<div class="stat-pill">✅ 本月完成 <b>' + doneThisMonth + '</b> 件</div>';
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 3600) return Math.max(1, Math.floor(diff/60)) + ' 分鐘前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小時前';
  if (diff < 86400*30) return Math.floor(diff/86400) + ' 天前';
  return new Date(iso).toLocaleDateString('zh-TW');
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function renderList() {
  const list = activeFilter === 'all' ? cases : cases.filter(c => c.status === activeFilter);
  const el = document.getElementById('caseList');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state">目前沒有符合條件的案件' + (mode==='admin' ? '，點上方「＋ 新增報修案件」開始登記' : '') + '</div>';
    return;
  }
  el.innerHTML = list.map(c => {
    const s = STATUS_DEF[c.status] || STATUS_DEF.received;
    const latest = (c.updates && c.updates[0]) ? c.updates[0] : null;
    return '<div class="case-card" style="--st-c:' + s.color + '" onclick="openDetail(\'' + c.caseId + '\')">' +
      '<div class="case-top"><div class="case-title">' + esc(c.title) + '</div>' +
      '<div class="status-badge" style="--st-c:' + s.color + ';--st-l:' + s.light + '">' + s.label + '</div></div>' +
      '<div class="case-meta">' +
        (c.location ? '<span>📍 ' + esc(c.location) + '</span>' : '') +
        (c.vendor ? '<span>🔧 ' + esc(c.vendor) + '</span>' : '') +
        (c.quote ? '<span>💰 NT$ ' + esc(String(c.quote)) + '</span>' : '') +
      '</div>' +
      (latest ? '<div class="case-latest"><b>' + timeAgo(latest.timestamp) + '更新：</b>' + esc(latest.content) + '</div>'
              : '<div class="case-latest">尚無進度更新</div>') +
    '</div>';
  }).join('');
}

function render() { renderFilters(); renderStats(); renderList(); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

/* ============ 詳情 Modal ============ */
function openDetail(caseId) {
  const c = cases.find(x => x.caseId === caseId);
  if (!c) return;
  const s = STATUS_DEF[c.status] || STATUS_DEF.received;
  document.getElementById('detailTitle').innerHTML =
    esc(c.title) + ' <span class="status-badge" style="--st-c:' + s.color + ';--st-l:' + s.light + '">' + s.label + '</span>';

  let html = '<div class="info-grid">' +
    infoBlock('地點', c.location) + infoBlock('通報來源', c.source) +
    infoBlock('廠商', c.vendor) + infoBlock('報價', c.quote ? 'NT$ ' + c.quote : '—') +
    infoBlock('登記人', c.createdBy) + infoBlock('建立時間', fmtDate(c.createdAt)) +
    '<div class="full">' + infoBlock('問題描述', c.description) + '</div>' +
    '</div>';

  if (mode === 'admin') {
    html += '<div class="section-divider">編輯案件</div>' +
      '<div class="field-row">' +
      '<div class="field"><label>狀態</label><select id="eStatus">' + STATUS_ORDER.map(k => '<option value="'+k+'"'+(k===c.status?' selected':'')+'>'+STATUS_DEF[k].label+'</option>').join('') + '</select></div>' +
      '<div class="field"><label>廠商</label><input id="eVendor" value="' + esc(c.vendor||'') + '"></div>' +
      '</div>' +
      '<div class="field-row">' +
      '<div class="field"><label>報價金額</label><input id="eQuote" value="' + esc(c.quote||'') + '" placeholder="數字"></div>' +
      '<div class="field"><label>預計完成日</label><input id="eExpected" type="date" value="' + esc(c.expectedDate||'') + '"></div>' +
      '</div>' +
      '<button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="saveEdit(\'' + c.caseId + '\')">儲存案件資訊</button>' +
      '<div class="section-divider">新增進度更新</div>' +
      '<div class="field"><textarea id="uContent" placeholder="例如：廠商已到場評估，預計三天內報價"></textarea></div>' +
      '<div class="field"><input id="uAuthor" placeholder="更新人姓名"></div>' +
      '<button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="submitUpdate(\'' + c.caseId + '\')">送出更新</button>';
  }

  html += '<div class="section-divider">處理時間軸</div><div class="timeline">' + renderTimeline(c) + '</div>';

  document.getElementById('detailBody').innerHTML = html;
  openModal('detailOverlay');
}
function infoBlock(label, val) {
  return '<div><div class="info-label">' + label + '</div><div class="info-value">' + esc(val || '—') + '</div></div>';
}
function renderTimeline(c) {
  const items = [{ timestamp: c.createdAt, content: '案件建立', author: c.createdBy || '系統' }].concat(c.updates || []);
  items.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  if (!items.length) return '<div style="color:var(--muted); font-size:15px;">尚無紀錄</div>';
  return items.map((it, i) =>
    '<div class="tl-item"><div class="tl-dot-col"><div class="tl-dot"></div>' + (i < items.length-1 ? '<div class="tl-line"></div>' : '') + '</div>' +
    '<div class="tl-content"><div class="tl-top"><span class="tl-author">' + esc(it.author||'—') + '</span><span>' + fmtDate(it.timestamp) + '</span></div>' +
    '<div class="tl-text">' + esc(it.content) + '</div>' +
    (it.photoUrl ? '<a class="tl-photo" href="' + esc(it.photoUrl) + '" target="_blank">📎 查看附件</a>' : '') + '</div></div>'
  ).join('');
}

async function saveEdit(caseId) {
  try {
    await api.updateCase({
      caseId,
      status: document.getElementById('eStatus').value,
      vendor: document.getElementById('eVendor').value,
      quote: document.getElementById('eQuote').value,
      expectedDate: document.getElementById('eExpected').value
    });
    showToast('已儲存');
    await refresh();
    openDetail(caseId);
  } catch (err) { showToast('錯誤：' + err.message); }
}
async function submitUpdate(caseId) {
  const content = document.getElementById('uContent').value.trim();
  if (!content) { showToast('請輸入更新內容'); return; }
  try {
    await api.addUpdate({ caseId, content, author: document.getElementById('uAuthor').value.trim() });
    showToast('已新增更新');
    await refresh();
    openDetail(caseId);
  } catch (err) { showToast('錯誤：' + err.message); }
}

/* ============ 新增案件 Modal ============ */
function openCreateModal() { openModal('createOverlay'); }
async function submitCreate() {
  const title = document.getElementById('cTitle').value.trim();
  if (!title) { showToast('請輸入報修項目'); return; }
  try {
    await api.createCase({
      title,
      location: document.getElementById('cLocation').value.trim(),
      description: document.getElementById('cDesc').value.trim(),
      source: document.getElementById('cSource').value,
      createdBy: document.getElementById('cCreatedBy').value.trim()
    });
    showToast('案件已建立');
    closeModal('createOverlay');
    ['cTitle','cLocation','cDesc','cCreatedBy'].forEach(id => document.getElementById(id).value = '');
    await refresh();
  } catch (err) { showToast('錯誤：' + err.message); }
}

/* ============ 共用 ============ */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('show'); });
});
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
async function refresh() {
  try { cases = await api.list(); render(); }
  catch (err) { showToast('讀取失敗：' + err.message); }
}
